<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ملتقى تقييم الطلاب</title>
<meta name="theme-color" content="#4fb3ea">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ملتقى">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<script>if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
<style>
:root{
  --bg:#f6f8fb; --card:#ffffff; --ink:#18243a; --muted:#5d6b82; --line:#e3e8f0;
  --brand:#2f9ee0; --brand-soft:#e3f3fd; --good:#16a34a; --good-soft:#dcfce7;
  --bad:#dc2626; --bad-soft:#fee2e2; --warn:#c27c0e; --warn-soft:#fef3c7;
  --gold:#f5b301; --radius:18px; --shadow:0 2px 10px rgba(24,36,58,.07);
  --nav-h:68px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.display{font-family:'Baloo Bhaijaan 2',Tajawal,sans-serif}
.num{font-variant-numeric:tabular-nums}

/* ---------- الهيكل ---------- */
header{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px rgba(47,158,224,.35)}
header h1{margin:0;font-size:22px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.class-pick{background:rgba(255,255,255,.2);border:0;border-radius:999px;padding:8px 14px;color:#fff;font-weight:700;max-width:52vw}
.class-pick option{color:var(--ink)}
main{max-width:980px;margin:0 auto;padding:14px 16px calc(var(--nav-h) + 30px + env(safe-area-inset-bottom,0px))}
nav.tabs{position:fixed;bottom:0;inset-inline:0;z-index:20;background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 12px rgba(24,36,58,.06)}
nav.tabs button{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:14px;color:var(--muted);font-weight:700;font-size:14px}
nav.tabs button .ic{font-size:24px;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--brand);background:var(--brand-soft)}

/* ---------- عناصر عامة ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:19px;display:flex;align-items:center;gap:8px}
.hint{color:var(--muted);font-size:15px;margin:4px 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:10px 18px;font-weight:800;background:var(--brand);color:#fff;min-height:44px}
.btn.soft{background:var(--brand-soft);color:#0b6aa3}
.btn.ghost{background:#eef1f6;color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.good{background:var(--good);color:#fff}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input{width:100%;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;min-height:46px}
.input:focus{outline:none;border-color:var(--brand)}
.seg{display:flex;background:#eaeef4;border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;border-radius:999px;padding:8px 10px;font-weight:800;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .big{font-size:56px}

/* ---------- صورة الطالب ---------- */
.av{border-radius:50%;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;background:#94a3b8;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}

/* ---------- شاشة التقييم ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:800;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.mode-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.mode-bar .hint{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.stu{position:relative;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border:3px solid transparent;transition:transform .12s}
.stu:active{transform:scale(.96)}
.stu .name{font-weight:800;font-size:16px;line-height:1.25;word-break:break-word}
.stu .score{font-size:14px;font-weight:800;border-radius:999px;padding:2px 10px;background:var(--brand-soft);color:#0b6aa3}
.stu .score.neg{background:var(--bad-soft);color:var(--bad)}
.stu .minus{position:absolute;top:6px;inset-inline-start:6px;width:34px;height:34px;border-radius:50%;background:#f1f4f8;color:var(--bad);font-weight:800;font-size:20px;line-height:1}
.stu.st-p{border-color:#86efac}.stu.st-a{border-color:#fca5a5;opacity:.75}.stu.st-l{border-color:#fcd34d}
.st-badge{font-size:14px;font-weight:800;border-radius:999px;padding:2px 10px}
.st-badge.p{background:var(--good-soft);color:var(--good)}
.st-badge.a{background:var(--bad-soft);color:var(--bad)}
.st-badge.l{background:var(--warn-soft);color:var(--warn)}
.st-badge.n{background:#eef1f6;color:var(--muted)}
.stu.picked{border-color:var(--gold);box-shadow:0 0 0 6px rgba(245,179,1,.25)}
.pop{position:absolute;top:30%;left:50%;transform:translateX(-50%);font-weight:800;font-size:26px;pointer-events:none;animation:pop .8s ease-out forwards}
@keyframes pop{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-46px)}}

/* ---------- النوافذ السفلية ---------- */
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet.enter{animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#d5dbe5;margin:0 auto 12px}
.sheet-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.sheet-head h3{margin:0;font-size:24px}
.x{margin-inline-start:auto;width:40px;height:40px;border-radius:50%;background:#eef1f6;font-size:20px;flex:none}
.crit-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.crit-row:last-child{border-bottom:0}
.crit-row .lbl{flex:1;font-weight:800;display:flex;align-items:center;gap:8px}
.crit-row .lbl small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.pm{width:48px;height:48px;border-radius:50%;font-size:24px;font-weight:800}
.pm.plus{background:var(--good);color:#fff}
.pm.minus{background:var(--bad-soft);color:var(--bad)}
.cnt{min-width:36px;text-align:center;font-size:20px;font-weight:800}
.att{display:flex;gap:6px}
.att button{border-radius:12px;padding:8px 10px;font-weight:800;background:#eef1f6;color:var(--muted);min-height:44px}
.att button.on.p{background:var(--good);color:#fff}
.att button.on.a{background:var(--bad);color:#fff}
.att button.on.l{background:var(--gold);color:#fff}

/* ---------- النتائج ---------- */
.period-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 4px}
.period-nav .lbl{font-weight:800;text-align:center;flex:1}
.period-nav button{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:22px;font-weight:800}
.board{background:linear-gradient(180deg,#fff8e1,#ffffff 70%)}
.board h2{justify-content:center;font-size:22px}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:8px;margin:10px 0 0}
.podium .p{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;max-width:150px;text-align:center}
.podium .crown{font-size:30px;line-height:1;margin-bottom:-4px}
.podium .pn{font-weight:800;font-size:15px;word-break:break-word;line-height:1.25}
.podium .pts{font-weight:800;color:#0b6aa3;font-size:14px}
.podium .sub{color:var(--muted);font-size:12px}
.step{width:100%;border-radius:14px 14px 0 0;display:flex;justify-content:center;padding-top:6px;font-size:30px;font-weight:800;color:#fff;font-family:'Baloo Bhaijaan 2',Tajawal,sans-serif;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.step.r1{height:104px;background:linear-gradient(#fcd34d,#f59e0b)}
.step.r2{height:76px;background:linear-gradient(#e2e8f0,#94a3b8)}
.step.r3{height:56px;background:linear-gradient(#f5c29b,#c2672d)}
.grid.groups{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grp{position:relative;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border-top:7px solid var(--gc);transition:transform .12s}
.grp:active{transform:scale(.96)}
.grp .name{font-weight:800;font-size:18px;word-break:break-word}
.faces{display:flex;flex-wrap:wrap;justify-content:center;gap:3px}
.more{font-size:12px;font-weight:800;color:var(--muted);align-self:center}
.grp .score{font-size:15px;font-weight:800;border-radius:999px;padding:2px 12px;background:var(--brand-soft);color:#0b6aa3}
.grp .score.neg{background:var(--bad-soft);color:var(--bad)}
.grp .minus{position:absolute;top:8px;inset-inline-start:6px;width:34px;height:34px;border-radius:50%;background:#f1f4f8;color:var(--bad);font-weight:800;font-size:20px;line-height:1}
.gav{font-weight:400!important}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:40px;height:40px;border-radius:50%}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink)}
.check-item{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.check-item input{width:24px;height:24px;accent-color:var(--brand);flex:none}
.check-item .t{flex:1;font-weight:700}
.check-item small{color:var(--muted);font-size:12px}
.linkbtn{color:#0b6aa3;font-weight:800;text-decoration:underline;padding:0}
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:420px}
th,td{padding:10px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-size:13px;font-weight:800}
td.n{text-align:start;font-weight:800}
td.n .in{display:flex;align-items:center;gap:8px}
td.tot{font-weight:800;color:#0b6aa3;font-size:17px}
tr.click{cursor:pointer}
.neg{color:var(--bad)}
.log-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.log-item .when{color:var(--muted);font-size:13px;min-width:86px}
.log-item .what{flex:1}
.log-item .del{color:var(--bad);font-weight:800;padding:6px 10px}

/* ---------- الإعدادات ---------- */
.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .t{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis}
.list-item .t small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.switch{position:relative;width:52px;height:30px;border-radius:999px;background:#cbd5e1;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:inset-inline-start .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{inset-inline-start:25px}
.emoji-pick{display:flex;flex-wrap:wrap;gap:6px}
.emoji-pick button{width:44px;height:44px;border-radius:12px;background:#f1f4f8;font-size:22px}
.emoji-pick button[aria-pressed="true"]{background:var(--brand-soft);box-shadow:inset 0 0 0 2px var(--brand)}
.icon-btn{width:40px;height:40px;border-radius:50%;background:#f1f4f8;font-size:17px;flex:none}
.photo-edit{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:14px}
label.field{display:block;font-weight:700;margin:10px 0 6px}
textarea.input{min-height:120px;resize:vertical}

/* ---------- تنبيه ---------- */
.toast{position:fixed;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;border-radius:999px;padding:10px 12px 10px 18px;display:flex;align-items:center;gap:12px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.toast button{background:rgba(255,255,255,.15);color:#fff;border-radius:999px;padding:6px 14px;font-weight:800}

.wheel-wrap{position:fixed;inset:0;z-index:45;background:linear-gradient(180deg,#e8f5fe,#fdf6e3);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.wheel-top{display:flex;align-items:center;gap:8px;max-width:560px;margin:0 auto 8px}
.wheel-top h2{margin:0;flex:1;font-size:24px}
.wheel-box{position:relative;width:min(92vw,440px);margin:6px auto 0}
.wheel-box svg{display:block;width:100%;height:auto}
.wheel-pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid #e11d48;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));z-index:2}
.wheel-now{text-align:center;font-weight:800;font-size:26px;min-height:40px;margin:10px 0 4px}
.wheel-ctrl{max-width:440px;margin:0 auto;display:grid;gap:10px}
.spin-btn{font-size:26px;padding:14px;min-height:60px;background:var(--gold);color:var(--ink)}
.picked-list{display:flex;flex-wrap:wrap;gap:6px}
.picked-list button{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:4px 12px 4px 4px;font-weight:700;font-size:14px;box-shadow:var(--shadow)}
.win{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.win-card{background:#fff;border-radius:28px;padding:24px;width:100%;max-width:420px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;animation:up .25s ease-out}
.win-card .wn{font-size:40px;font-weight:800;line-height:1.2;word-break:break-word}
.win-card .row{width:100%}
.win-card .row .btn{flex:1;min-height:56px;font-size:19px}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(136px,1fr))}}
@media print{
  header,nav.tabs,.no-print,.toast{display:none!important}
  main{padding:0;max-width:none}
  .card{box-shadow:none;border:1px solid #ddd}
  body{background:#fff}
  .tbl-wrap{overflow:visible}
}
</style>
</head>
<body>
<header>
  <h1 class="display">ملتقى</h1>
  <select class="class-pick" id="classPick" aria-label="اختيار الصف"></select>
</header>
<main id="main"></main>
<nav class="tabs" aria-label="التنقل">
  <button data-act="tab" data-tab="rate"><span class="ic">⭐</span>التقييم</button>
  <button data-act="tab" data-tab="results"><span class="ic">📊</span>النتائج</button>
  <button data-act="tab" data-tab="settings"><span class="ic">⚙️</span>الإعدادات</button>
</nav>
<div id="wheelRoot"></div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="importFile" accept=".json,application/json,text/plain" hidden>

<script>
'use strict';
/* =====================================================================
   البيانات
   ===================================================================== */
const KEY = 'multaqa-v2';
const OLD_KEY = 'multaqa-suluk-v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const DEFAULT_CRITERIA = [
  { id: 'part', name: 'المشاركة', icon: '🙋', type: 'points', on: true },
  { id: 'disc', name: 'الانضباط', icon: '📏', type: 'points', on: true },
  { id: 'hw',   name: 'الواجبات', icon: '📚', type: 'points', on: true },
  { id: 'att',  name: 'الحضور والغياب', icon: '✅', type: 'attendance', on: true },
  { id: 'coop', name: 'التعاون', icon: '🤝', type: 'points', on: false },
  { id: 'clean',name: 'النظافة والترتيب', icon: '🧹', type: 'points', on: false },
  { id: 'read', name: 'القراءة', icon: '📖', type: 'points', on: false },
];
const EMOJIS = ['🙋','📏','📚','✅','🤝','🧹','📖','✍️','💡','🎨','⚽','🗣️','⏰','🌟','❤️','🧠','🔢','🕌','🎵','🧪'];
const PERIODS = { day: 'يومي', week: 'أسبوعي', month: 'شهري' };
const GROUP_ICONS = ['🦁','🐯','🦅','🐬','🐝','🦋','🚀','🌟','🌈','🌻','💎','🔥','⚡','🍀','🏆','🎯'];
const GROUP_COLORS = ['#3b9fe0','#f59e0b','#10b981','#ec4899','#8b5cf6','#f97316','#14b8a6','#ef4444'];
const GROUP_NAMES = ['الأسود','النسور','النجوم','الصقور','الفراشات','المبدعون','الأبطال','العباقرة','المتميزون','الرواد'];
const ATT = { p: 'حاضر', a: 'غائب', l: 'متأخر' };
const AV_COLORS = ['#3b9fe0','#f59e0b','#10b981','#ec4899','#8b5cf6','#f97316','#14b8a6','#6366f1','#ef4444','#84cc16'];

const newClass = name => ({ id: uid(), name, students: [], groups: [], events: [] });
const fresh = () => {
  const c = newClass('صفي الأول');
  return { v: 2, currentId: c.id, period: 'week', weekStart: 0, criteria: DEFAULT_CRITERIA.map(x => ({ ...x })), classes: [c] };
};

function normalize(d) {
  const out = fresh();
  if (Array.isArray(d.criteria) && d.criteria.length) {
    out.criteria = d.criteria.filter(c => c && c.name).map(c => ({
      id: String(c.id || uid()), name: String(c.name), icon: String(c.icon || '⭐'),
      type: c.type === 'attendance' ? 'attendance' : 'points', on: c.on !== false }));
  }
  if (PERIODS[d.period]) out.period = d.period;
  if ([0, 1, 6].includes(d.weekStart)) out.weekStart = d.weekStart;
  out.groupsChecked = !!d.groupsChecked;
  out.classes = (d.classes || []).map(c => normClass(c));
  if (!out.classes.length) out.classes = [newClass('صفي الأول')];
  out.currentId = out.classes.some(c => c.id === d.currentId) ? d.currentId : out.classes[0].id;
  return out;
}
function normGroups(list) {
  return (Array.isArray(list) ? list : []).filter(g => g && g.name).map((g, i) => ({
    id: String(g.id || uid()), name: String(g.name),
    icon: GROUP_ICONS.includes(g.icon) ? g.icon : GROUP_ICONS[i % GROUP_ICONS.length],
    color: /^#[0-9a-f]{6}$/i.test(g.color || '') ? g.color : GROUP_COLORS[i % GROUP_COLORS.length] }));
}
function normClass(c) {
  const groups = normGroups(c.groups);
  const gids = new Set(groups.map(g => g.id));
  return {
    id: String(c.id || uid()), name: String(c.name || 'صف'), groups,
    students: (c.students || []).map(s => ({ id: String(s.id || uid()), name: String(s.name || ''), photo: typeof s.photo === 'string' ? s.photo : null,
      groupId: s.groupId && gids.has(String(s.groupId)) ? String(s.groupId) : null })).filter(s => s.name),
    events: Array.isArray(c.events) ? c.events.filter(e => e && e.s && e.c && e.t) : [],
    wheel: c.wheel && typeof c.wheel.date === 'string' && Array.isArray(c.wheel.picked) ? { date: c.wheel.date, picked: c.wheel.picked.map(String) } : null,
  };
}

// استرجاع المجموعات من النسخة الأولى للتطبيق (مرة واحدة فقط)
function recoverGroups(st) {
  if (st.groupsChecked) return st;
  st.groupsChecked = true;
  try {
    const o = JSON.parse(localStorage.getItem(OLD_KEY) || 'null');
    if (!o || !Array.isArray(o.classes)) return st;
    o.classes.forEach(oc => {
      const c = st.classes.find(x => x.id === String(oc.id));
      if (!c || c.groups.length || !Array.isArray(oc.groups) || !oc.groups.length) return;
      c.groups = normGroups(oc.groups);
      (oc.students || []).forEach(os => {
        const s = c.students.find(x => x.id === String(os.id));
        if (s && os.groupId && c.groups.some(g => g.id === String(os.groupId))) s.groupId = String(os.groupId);
      });
      migratedNote = 'استُرجعت مجموعاتك من النسخة السابقة';
    });
  } catch (e) {}
  return st;
}

let migratedNote = '';
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return recoverGroups(normalize(JSON.parse(raw)));
    const old = localStorage.getItem(OLD_KEY);
    if (old) {
      const o = JSON.parse(old);
      if (o && Array.isArray(o.classes) && o.classes.length) {
        migratedNote = 'نُقلت صفوفك وأسماء طلابك من النسخة السابقة';
        return normalize({ classes: o.classes.map(c => ({ id: c.id, name: c.name, students: c.students, groups: c.groups })), currentId: o.currentId, groupsChecked: true });
      }
    }
  } catch (e) {}
  return fresh();
}

let state = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); return true; }
  catch (e) { toast('ذاكرة الجهاز ممتلئة. احذفي بعض الصور أو صدّري نسخة احتياطية.'); return false; }
}
const cls = () => state.classes.find(c => c.id === state.currentId) || state.classes[0];
const crit = id => state.criteria.find(c => c.id === id);
const activeCriteria = () => state.criteria.filter(c => c.on);
const pointCriteria = () => activeCriteria().filter(c => c.type === 'points');
const attCriterion = () => activeCriteria().find(c => c.type === 'attendance');

/* =====================================================================
   التواريخ والفترات
   ===================================================================== */
const dayKey = t => { const d = new Date(t); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

function range(period, offset) {
  const now = startOfDay(new Date());
  let a, b;
  if (period === 'day') { a = new Date(now); a.setDate(a.getDate() + offset); b = new Date(a); b.setDate(b.getDate() + 1); }
  else if (period === 'week') {
    a = new Date(now); a.setDate(a.getDate() - ((a.getDay() - state.weekStart + 7) % 7) + offset * 7);
    b = new Date(a); b.setDate(b.getDate() + 7);
  } else { a = new Date(now.getFullYear(), now.getMonth() + offset, 1); b = new Date(a.getFullYear(), a.getMonth() + 1, 1); }
  return { a: +a, b: +b };
}
function rangeLabel(period, offset) {
  const { a, b } = range(period, offset);
  const A = new Date(a), B = new Date(b - 1);
  if (period === 'day') {
    const rel = offset === 0 ? 'اليوم' : offset === -1 ? 'أمس' : DAYS[A.getDay()];
    return rel + ' · ' + A.getDate() + ' ' + MONTHS[A.getMonth()];
  }
  if (period === 'week') {
    const rel = offset === 0 ? 'هذا الأسبوع' : offset === -1 ? 'الأسبوع الماضي' : 'أسبوع';
    const m = A.getMonth() === B.getMonth() ? '' : ' ' + MONTHS[A.getMonth()];
    return rel + ' · ' + A.getDate() + m + ' – ' + B.getDate() + ' ' + MONTHS[B.getMonth()];
  }
  return (offset === 0 ? 'هذا الشهر · ' : '') + MONTHS[A.getMonth()] + ' ' + A.getFullYear();
}
const periodWord = p => ({ day: 'اليوم', week: 'هذا الأسبوع', month: 'هذا الشهر' })[p];

/* =====================================================================
   الحسابات
   ===================================================================== */
function eventsIn(c, a, b) { return c.events.filter(e => e.t >= a && e.t < b); }

// حالة الحضور لكل طالب في كل يوم (آخر تسجيل في اليوم هو المعتمد)
function attendanceMap(evs, critId) {
  const m = {};
  evs.filter(e => e.c === critId && e.a).forEach(e => {
    const k = e.s + '|' + dayKey(e.t);
    if (!m[k] || m[k].t <= e.t) m[k] = e;
  });
  return m;
}
function todayStatus(c, sid) {
  const ac = attCriterion(); if (!ac) return null;
  const { a, b } = range('day', 0);
  const m = attendanceMap(eventsIn(c, a, b), ac.id);
  const e = m[sid + '|' + dayKey(a)];
  return e ? e.a : null;
}
function stats(c, a, b) {
  const evs = eventsIn(c, a, b);
  const pcs = pointCriteria(), ac = attCriterion();
  const am = ac ? attendanceMap(evs, ac.id) : {};
  return c.students.map(s => {
    const per = {}; let total = 0;
    pcs.forEach(pc => { per[pc.id] = 0; });
    evs.forEach(e => { if (e.s === s.id && per[e.c] !== undefined && e.d) { per[e.c] += e.d; total += e.d; } });
    const att = { p: 0, a: 0, l: 0 };
    Object.values(am).forEach(e => { if (e.s === s.id) att[e.a]++; });
    return { s, per, total, att };
  });
}
function groupStats(c, a, b) {
  const st = stats(c, a, b);
  return c.groups.map(g => {
    const mem = st.filter(x => x.s.groupId === g.id);
    const per = {}; pointCriteria().forEach(p => { per[p.id] = mem.reduce((t, x) => t + x.per[p.id], 0); });
    return { g, mem, per, total: mem.reduce((t, x) => t + x.total, 0) };
  }).sort((x, y) => y.total - x.total || x.g.name.localeCompare(y.g.name, 'ar'));
}
const groupOf = (c, s) => c.groups.find(g => g.id === s.groupId) || null;
function rankStats(list) {
  return list.slice().sort((x, y) => y.total - x.total || (x.att.a - y.att.a) || x.s.name.localeCompare(y.s.name, 'ar'));
}

/* =====================================================================
   أدوات العرض
   ===================================================================== */
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
const $ = sel => document.querySelector(sel);
const signed = n => (n > 0 ? '+' : '') + n;
function avatar(s, size) {
  const style = `width:${size}px;height:${size}px;font-size:${Math.round(size * .4)}px`;
  if (s.photo) return `<span class="av" style="${style}"><img src="${s.photo}" alt=""></span>`;
  let h = 0; for (const ch of s.id) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const initial = (s.name.trim().split(/\s+/)[0] || '?').charAt(0);
  return `<span class="av" style="${style};background:${AV_COLORS[h % AV_COLORS.length]}">${esc(initial)}</span>`;
}

function groupAvatar(g, size) {
  return `<span class="av gav" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .5)}px;background:${g.color}">${g.icon}</span>`;
}
const ui = { tab: 'rate', view: 'students', rview: 'students', mode: 'all', period: state.period, offset: 0, picked: null };

/* =====================================================================
   شاشة التقييم
   ===================================================================== */
function renderRate() {
  const c = cls();
  if (!c.students.length) {
    return `<div class="card empty"><div class="big">👩‍🏫</div>
      <h2 style="justify-content:center">ابدئي بإضافة طلاب ${esc(c.name)}</h2>
      <p>أضيفي الأسماء دفعة واحدة، ثم صورة كل طالب إن رغبتِ.</p>
      <button class="btn" data-act="addStudents">➕ إضافة طلاب</button></div>`;
  }
  const gv = ui.view === 'groups';
  const acts = activeCriteria().filter(x => !gv || x.type === 'points');
  if (!acts.some(x => x.id === ui.mode)) ui.mode = 'all';
  const m = ui.mode === 'all' ? null : crit(ui.mode);
  const viewSeg = `<div class="seg" role="group" aria-label="العرض" style="margin-bottom:12px">
    <button data-act="view" data-id="students" aria-pressed="${!gv}">👧 الطلاب</button>
    <button data-act="view" data-id="groups" aria-pressed="${gv}">👥 المجموعات${c.groups.length ? ` (${c.groups.length})` : ''}</button></div>`;
  if (gv && !c.groups.length) {
    return viewSeg + `<div class="card empty"><div class="big">👥</div>
      <h2 style="justify-content:center">لا توجد مجموعات بعد</h2>
      <p>أنشئي مجموعات وسمّيها، واختاري طلاب كل مجموعة، ثم قيّميها معاً.</p>
      <div class="row" style="justify-content:center"><button class="btn" data-act="quickGroups">⚡ إنشاء مجموعات وتوزيع الطلاب</button>
      <button class="btn soft" data-act="addGroup">➕ مجموعة واحدة</button></div></div>`;
  }
  const chips = `<div class="chips" role="group" aria-label="طريقة التقييم">
    <button class="chip" data-act="mode" data-id="all" aria-pressed="${ui.mode === 'all'}">⭐ كل المعايير</button>
    ${acts.map(x => `<button class="chip" data-act="mode" data-id="${x.id}" aria-pressed="${ui.mode === x.id}">${x.icon} ${esc(x.name)}</button>`).join('')}
  </div>`;

  let hint, extra = '';
  if (gv) hint = m ? `اضغطي على المجموعة لإضافة نقطة «${esc(m.name)}» لكل أعضائها، و − للخصم.`
                   : 'اضغطي على المجموعة لتقييمها. النقاط تُضاف لكل أعضائها الحاضرين.';
  else if (!m) hint = 'اضغطي على الطالب لتقييمه في كل المعايير.';
  else if (m.type === 'points') hint = `اضغطي على الطالب لإضافة نقطة في «${esc(m.name)}»، و − للخصم.`;
  else {
    hint = 'اضغطي على الطالب للتبديل: حاضر ← غائب ← متأخر.';
    extra = `<button class="btn soft" data-act="allPresent">✅ الكل حاضر</button>`;
  }
  const bar = `<div class="mode-bar"><p class="hint">${hint}</p><div class="row">${extra}
    <button class="btn ghost" data-act="openWheel">🎡 عجلة المشاركة</button></div></div>`;

  const { a, b } = range(state.period, 0);
  const st = Object.fromEntries(stats(c, a, b).map(x => [x.s.id, x]));
  const val = s => m ? st[s.id].per[m.id] : st[s.id].total;

  if (gv) {
    const cards = c.groups.map(g => {
      const mem = c.students.filter(s => s.groupId === g.id);
      const v = mem.reduce((t, s) => t + val(s), 0);
      const minus = m ? `<button class="minus" data-act="grpMinus" data-id="${g.id}" aria-label="خصم نقطة من مجموعة ${esc(g.name)}">−</button>` : '';
      const faces = mem.slice(0, 6).map(s => avatar(s, 28)).join('') + (mem.length > 6 ? `<span class="more">+${mem.length - 6}</span>` : '');
      return `<div class="grp" role="button" tabindex="0" data-act="grp" data-id="${g.id}" style="--gc:${g.color}">${minus}
        ${groupAvatar(g, 64)}<span class="name">${esc(g.name)}</span>
        <span class="faces">${faces || '<span class="hint" style="margin:0">بدون أعضاء</span>'}</span>
        <span class="score num ${v < 0 ? 'neg' : ''}">${signed(v)}</span></div>`;
    }).join('');
    const free = c.students.filter(s => !s.groupId).length;
    return viewSeg + chips + bar + `<div class="grid groups">${cards}</div>
      ${free ? `<p class="hint" style="margin-top:12px">${free} طالب بدون مجموعة · <button class="linkbtn" data-act="goGroups">توزيعهم</button></p>` : ''}
      <p class="hint" style="margin-top:12px">نقاط المجموعة = مجموع نقاط أعضائها ${periodWord(state.period)}.</p>`;
  }

  const cards = c.students.map(s => {
    const status = todayStatus(c, s.id);
    let badge = '', minus = '';
    if (m && m.type === 'attendance') {
      badge = `<span class="st-badge ${status || 'n'}">${status ? ATT[status] : 'لم يُسجَّل'}</span>`;
    } else {
      const v = val(s);
      badge = `<span class="score num ${v < 0 ? 'neg' : ''}" title="${periodWord(state.period)}">${signed(v)}</span>`;
      if (m) minus = `<button class="minus" data-act="quickMinus" data-id="${s.id}" aria-label="خصم نقطة من ${esc(s.name)}">−</button>`;
    }
    const cl = ['stu', status ? 'st-' + status : '', ui.picked === s.id ? 'picked' : ''].join(' ');
    return `<div class="${cl}" role="button" tabindex="0" data-act="stu" data-id="${s.id}">${minus}
      ${avatar(s, 72)}<span class="name">${esc(s.name)}</span>${badge}</div>`;
  }).join('');
  const scoreNote = m && m.type === 'attendance' ? '' : `<p class="hint" style="margin-top:12px">الأرقام تمثل نقاط ${periodWord(state.period)}. غيّري الفترة من الإعدادات.</p>`;
  return viewSeg + chips + bar + `<div class="grid">${cards}</div>` + scoreNote;
}

// تقييم مجموعة = نقطة لكل عضو حاضر فيها، تُسجَّل كدفعة واحدة يمكن التراجع عنها
function groupPoint(gid, cid, d) {
  const c = cls(); const g = c.groups.find(x => x.id === gid);
  const mem = c.students.filter(s => s.groupId === gid && todayStatus(c, s.id) !== 'a');
  if (!mem.length) { toast('لا يوجد أعضاء حاضرون في هذه المجموعة'); return; }
  const b = uid(), t = Date.now();
  mem.forEach(s => c.events.push({ id: uid(), t, s: s.id, c: cid, d, g: gid, b }));
  save(); render(); refreshSheet();
  popAt(gid, signed(d), d > 0 ? 'var(--good)' : 'var(--bad)');
  toast(`${signed(d)} ${crit(cid).name} · ${g.name} (${mem.length} طالب)`, () => {
    const k = cls(); k.events = k.events.filter(e => e.b !== b); save(); render(); refreshSheet();
  });
}

function groupSheet(gid) {
  return () => {
    const c = cls(); const g = c.groups.find(x => x.id === gid); if (!g) return null;
    const { a, b } = range(state.period, 0);

      <h3 style="margin:16px 0 4px">الأعضاء</h3>${mem || '<p class="hint">لا يوجد أعضاء.</p>'}

  };
}

function addEvent(sid, cid, d) {
  const e = { id: uid(), t: Date.now(), s: sid, c: cid, d };
  cls().events.push(e); save(); return e;
}
function setAttendance(sid, status) {
  const ac = attCriterion(); if (!ac) return;
  const c = cls(); const { a, b } = range('day', 0);
  c.events = c.events.filter(e => !(e.s === sid && e.c === ac.id && e.a && e.t >= a && e.t < b));
  if (status) c.events.push({ id: uid(), t: Date.now(), s: sid, c: ac.id, a: status });
  save();
}
function popAt(sid, text, color) {
  const el = document.querySelector(`.stu[data-id="${sid}"], .grp[data-id="${sid}"]`); if (!el) return;
  const p = document.createElement('span'); p.className = 'pop'; p.textContent = text; p.style.color = color;
  el.appendChild(p); setTimeout(() => p.remove(), 800);
}
function quickPoint(sid, d) {
  const e = addEvent(sid, ui.mode, d);
  render(); popAt(sid, signed(d), d > 0 ? 'var(--good)' : 'var(--bad)');
  const s = cls().students.find(x => x.id === sid);
  toast(`${signed(d)} ${crit(ui.mode).name} · ${s.name}`, () => undoEvent(e.id));
}
function undoEvent(eid) { const c = cls(); c.events = c.events.filter(e => e.id !== eid); save(); render(); refreshSheet(); }

const WIN_TITLE = { day: 'متصدرو اليوم', week: 'فائزو الأسبوع', month: 'فائزو الشهر' };
function podium(items, title) {
  return `<div class="card board"><h2 class="display">🏆 ${title}</h2>
    ${items.length ? '' : '<p class="hint" style="text-align:center">يظهر الفائزون هنا بعد إضافة التقييمات.</p>'}
    <div class="podium">${[1, 0, 2].map(i => {
      const it = items[i];
      const top = it ? `${i === 0 ? '<span class="crown">👑</span>' : ''}${it.av(i === 0 ? 84 : 64)}
          <span class="pn">${esc(it.name)}</span>${it.sub ? `<span class="sub">${esc(it.sub)}</span>` : ''}<span class="pts num">${it.total} نقطة</span>`
        : `<span class="av" style="width:56px;height:56px;background:#e5e9f0;color:#94a3b8;font-size:22px">؟</span><span class="pn" style="color:var(--muted)">—</span>`;
      return `<div class="p">${top}<div class="step r${i + 1}">${i + 1}</div></div>`;
    }).join('')}</div></div>`;
}

      ${pcs.map(p => `<td class="num ${x.per[p.id] < 0 ? 'neg' : ''}">${x.per[p.id] || '–'}</td>`).join('')}
      <td class="tot num ${x.total < 0 ? 'neg' : ''}">${x.total}</td></tr>`).join('');
    return seg + rseg + nav + pod + `<div class="card"><h2>👥 ترتيب المجموعات</h2>
      <div class="tbl-wrap"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>

  }

  const list = rankStats(stats(c, a, b));

  const pod = podium(list.filter(x => x.total > 0).slice(0, 3).map(x => {
    const g = groupOf(c, x.s);
    return { av: sz => avatar(x.s, sz), name: x.s.name, sub: g ? g.icon + ' ' + g.name : '', total: x.total };
  }), WIN_TITLE[ui.period]);

  const head = `<tr><th>#</th><th style="text-align:start">الطالب</th>${pcs.map(x => `<th>${x.icon}<br>${esc(x.name)}</th>`).join('')}

  const rows = list.map((x, i) => `<tr class="click" data-act="detail" data-id="${x.s.id}">

function detailSheet(sid) {

    const att = attCriterion() ? `<span class="chip" style="cursor:default">✅ حضور ${st.att.p} · غياب ${st.att.a} · تأخر ${st.att.l}</span>` : '';
    const items = evs.map(e => {

      const when = (ui.period === 'day' ? '' : DAYS[d.getDay()] + ' ') + d.toLocaleTimeString('ar', { hour: 'numeric', minute: '2-digit' });
      const what = cr ? `${cr.icon} ${esc(cr.name)}` : 'معيار محذوف';

}

function resultsText() {
  const c = cls(); const { a, b } = range(ui.period, ui.offset);
  const list = rankStats(stats(c, a, b)); const pcs = pointCriteria(); const ac = attCriterion();
  const medals = ['🥇', '🥈', '🥉'];
  const lines = [`📊 نتائج ${c.name} — ${rangeLabel(ui.period, ui.offset)}`, ''];
  const win = list.filter(x => x.total > 0).slice(0, 3);
  if (win.length) { lines.push(`🏆 ${WIN_TITLE[ui.period]}:`); win.forEach((x, i) => lines.push(`${medals[i]} ${x.s.name} (${x.total} نقطة)`)); lines.push(''); }
  if (c.groups.length) {
    lines.push('👥 ترتيب المجموعات:');
    groupStats(c, a, b).forEach((x, i) => lines.push(`${x.total > 0 && i < 3 ? medals[i] : (i + 1) + '.'} ${x.g.icon} ${x.g.name}: ${x.total} نقطة`));
    lines.push('');
  }
  lines.push('📋 ترتيب الطلاب:');
  list.forEach((x, i) => {
    const parts = pcs.map(p => `${p.name} ${x.per[p.id]}`);
    if (ac) parts.push(`غياب ${x.att.a}`);
    lines.push(`${i + 1}. ${x.s.name}: ${x.total} نقطة (${parts.join('، ')})`);
  });
  return lines.join('\n');
}

function resizeImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const S = 200, c = document.createElement('canvas'); c.width = c.height = S;
      const m = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .78));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

function keepGName() { const n = $('#grpName'); if (n) gDraft.name = n.value; }
function makeGroups(n) {
  const c = cls();
  for (let i = 0; i < n; i++) c.groups.push({ id: uid(), name: GROUP_NAMES[i % GROUP_NAMES.length], icon: GROUP_ICONS[i % GROUP_ICONS.length], color: GROUP_COLORS[i % GROUP_COLORS.length] });

function distribute() {
  const c = cls(); const s = c.students.slice();
  for (let i = s.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [s[i], s[j]] = [s[j], s[i]]; }
  s.forEach((x, i) => { x.groupId = c.groups[i % c.groups.length].id; });
}

/* =====================================================================
   عجلة المشاركة
   ===================================================================== */
const WHEEL_COLORS = ['#7cc8f7','#ffd66b','#8fe0b0','#f9a8c9','#c4b5fd','#fdba8c','#99e2e0','#fde68a'];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wheel = { rot: 0, spinning: false, winner: null, sound: (() => { try { return localStorage.getItem('multaqa-wheel-sound') !== '0'; } catch (e) { return true; } })() };

function wheelState(c) {
  const today = dayKey(Date.now());
  if (!c.wheel || c.wheel.date !== today) c.wheel = { date: today, picked: [] };
  c.wheel.picked = c.wheel.picked.filter(id => c.students.some(s => s.id === id));
  return c.wheel;
}
// الغائبون اليوم لا يظهرون في العجلة، ومن شارك اليوم يخرج منها
function wheelPool(c) { const w = wheelState(c); return c.students.filter(s => !w.picked.includes(s.id) && todayStatus(c, s.id) !== 'a'); }
// نقطة العجلة تذهب لمعيار «المشاركة» إن كان مفعّلاً، وإلا لأول معيار نقاط مفعّل
function wheelCriterion() { const pcs = pointCriteria(); return pcs.find(x => x.id === 'part') || pcs[0] || null; }

function wheelSVG(items) {
  const n = items.length, R = 240, C = 250;
  const pt = (deg, r) => { const a = deg * Math.PI / 180; return [C + r * Math.sin(a), C - r * Math.cos(a)]; };
  const seg = 360 / Math.max(1, n);
  const maxFs = n === 1 ? 44 : Math.max(14, Math.min(40, 2 * Math.PI * 150 / n * .75));
  let slices = '', labels = '';
  items.forEach((s, i) => {
    const color = WHEEL_COLORS[i % WHEEL_COLORS.length];
    if (n === 1) slices += `<circle cx="${C}" cy="${C}" r="${R}" fill="${color}"/>`;
    else {
      const [x1, y1] = pt(i * seg, R), [x2, y2] = pt((i + 1) * seg, R);
      slices += `<path d="M${C},${C} L${x1},${y1} A${R},${R} 0 ${seg > 180 ? 1 : 0} 1 ${x2},${y2} Z" fill="${color}" stroke="#fff" stroke-width="3"/>`;
    }
    const name = s.name.length > 16 ? s.name.slice(0, 15) + '…' : s.name;
    const fs = Math.max(13, Math.min(maxFs, (R - 70) / (name.length * .55)));
    // أسماء النصف الأيسر تُقلب حتى لا تظهر مقلوبة
    const mid = (i + .5) * seg, flip = n > 1 && mid > 180;
    labels += `<text transform="rotate(${flip ? mid + 90 : mid - 90} ${C} ${C})" x="${flip ? C - R + 18 : C + R - 18}" y="${C}" text-anchor="${flip ? 'start' : 'end'}" dominant-baseline="central"
      font-family="'Baloo Bhaijaan 2',Tajawal,sans-serif" font-weight="800" font-size="${fs.toFixed(1)}" fill="#132036"
      stroke="#fff" stroke-width="${Math.max(3, fs * .2).toFixed(1)}" stroke-linejoin="round" paint-order="stroke">${esc(name)}</text>`;
  });
  return `<svg viewBox="0 0 500 500" style="direction:ltr" role="img" aria-label="عجلة فيها ${n} أسماء">
    <circle cx="${C}" cy="${C}" r="${R + 8}" fill="#fff"/>
    <g id="wheelG" style="transform-origin:250px 250px;transform:rotate(${wheel.rot}deg)">${slices}${labels}</g>
    <circle cx="${C}" cy="${C}" r="30" fill="#fff" stroke="#ffd66b" stroke-width="6"/>
    <text x="${C}" y="${C}" text-anchor="middle" dominant-baseline="central" font-size="26">⭐</text></svg>`;
}

function drawWheel() {
  const c = cls(); const pool = wheelPool(c); const w = wheelState(c);
  const picked = w.picked.map(id => c.students.find(s => s.id === id)).filter(Boolean);
  const absent = c.students.filter(s => todayStatus(c, s.id) === 'a').length;
  const pc = wheelCriterion();
  let body;
  if (!c.students.length) body = `<div class="card empty"><div class="big">🎡</div><p>أضيفي طلاباً أولاً.</p></div>`;
  else if (!pool.length) body = `<div class="card empty"><div class="big">🎉</div><h2 style="justify-content:center">شارك الجميع اليوم!</h2>
      <button class="btn" data-act="wheelReset">🔄 إرجاع كل الأسماء للعجلة</button></div>`;
  else body = `<div class="wheel-box"><div class="wheel-pointer"></div>${wheelSVG(pool)}</div>
      <div class="wheel-now display" id="wheelNow" aria-live="polite"></div>
      <div class="wheel-ctrl"><button class="btn spin-btn display" data-act="spin" ${wheel.spinning ? 'disabled' : ''}>🎡 أديري العجلة</button>
        <p class="hint" style="text-align:center;margin:0">في العجلة ${pool.length} من ${c.students.length}${absent ? ` · الغائبون اليوم (${absent}) خارج العجلة` : ''}${pc ? ` · المشاركة تضيف +1 في «${esc(pc.name)}»` : ''}</p></div>`;
  const pickedHtml = picked.length ? `<div class="card" style="max-width:440px;margin:16px auto 0"><h2>✅ شاركوا اليوم (${picked.length})</h2>
      <p class="hint">اضغطي على الاسم لإرجاعه إلى العجلة.</p>
      <div class="picked-list">${picked.map(s => `<button data-act="unpick" data-id="${s.id}">${avatar(s, 28)}${esc(s.name)} ↩</button>`).join('')}</div>
      ${pool.length ? `<button class="btn ghost" data-act="wheelReset" style="margin-top:10px">🔄 إرجاع الجميع</button>` : ''}</div>` : '';
  const win = wheel.winner ? `<div class="win"><div class="win-card" role="dialog" aria-modal="true" aria-label="دور ${esc(wheel.winner.name)}">
      <div style="font-weight:800;color:var(--warn)">دور المشاركة الآن</div>${avatar(wheel.winner, 130)}
      <div class="wn display">${esc(wheel.winner.name)}</div>
      <div class="row"><button class="btn good" data-act="winYes">✅ شارك${pc ? ' +1' : ''}</button>
        <button class="btn ghost" data-act="winNo">↩️ لم يشارك</button></div>
      <button class="btn ghost" data-act="winOut" style="font-size:15px;min-height:40px">إخراجه من العجلة اليوم بدون نقطة</button></div></div>` : '';
  $('#wheelRoot').innerHTML = `<div class="wheel-wrap" role="dialog" aria-modal="true" aria-label="عجلة المشاركة">
    <div class="wheel-top"><h2 class="display">🎡 عجلة المشاركة</h2>
      <button class="icon-btn" data-act="wheelSound" aria-label="الصوت" aria-pressed="${wheel.sound}">${wheel.sound ? '🔊' : '🔇'}</button>
      <button class="x" data-act="closeWheel" aria-label="إغلاق" style="margin:0">✕</button></div>
    ${body}${pickedHtml}${win}</div>`;
}

let audioCtx = null;
function beep(freq = 900, dur = .04, vol = .08) {
  if (!wheel.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'triangle'; o.frequency.value = freq; g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(1e-4, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

function spinWheel() {
  const c = cls(); const pool = wheelPool(c); if (wheel.spinning || !pool.length) return;
  const n = pool.length, seg = 360 / n, idx = Math.floor(Math.random() * n);
  const target = (idx + .5) * seg + (Math.random() - .5) * seg * .6;      // نقطة داخل شريحة الفائز
  const cur = ((wheel.rot % 360) + 360) % 360;
  const delta = ((360 - target - cur) % 360 + 360) % 360;                  // ما يلزم لتصل النقطة إلى المؤشر في الأعلى
  const ms = reduceMotion ? 700 : 5200;
  wheel.rot += (reduceMotion ? 360 : 360 * 6) + delta;
  wheel.spinning = true;
  const g = $('#wheelG'), now = $('#wheelNow'), btn = document.querySelector('[data-act=spin]');
  btn.disabled = true;
  g.style.transition = `transform ${ms}ms cubic-bezier(.15,.75,.12,1)`;
  requestAnimationFrame(() => { g.style.transform = `rotate(${wheel.rot}deg)`; });
  if (wheel.sound && audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  let last = -1, lastBeep = 0, raf;
  const tick = () => {
    const m = getComputedStyle(g).transform;
    if (m && m !== 'none') {
      const v = m.slice(m.indexOf('(') + 1, -1).split(',').map(Number);
      const ang = Math.atan2(v[1], v[0]) * 180 / Math.PI;
      const i = Math.min(n - 1, Math.floor((((-ang) % 360) + 360) % 360 / seg));
      if (i !== last) { last = i; now.textContent = pool[i].name; const t = performance.now(); if (!reduceMotion && t - lastBeep > 45) { lastBeep = t; beep(760 + (i % 2) * 160); } }
    }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
  setTimeout(() => {
    cancelAnimationFrame(raf); wheel.spinning = false;
    wheel.winner = pool[idx]; now.textContent = pool[idx].name;
    beep(660, .12, .12); setTimeout(() => beep(990, .2, .12), 120);
    setTimeout(drawWheel, 350);
  }, ms + 80);
}

let toastTimer;
function toast(msg, undo) {
  clearTimeout(toastTimer);
  const root = $('#toastRoot');
  root.innerHTML = `<div class="toast" role="status" ${sheetFn ? 'style="bottom:auto;top:calc(env(safe-area-inset-top,0px) + 12px)"' : ''}><span>${esc(msg)}</span>${undo ? '<button data-act="undo">تراجع</button>' : ''}</div>`;
  toast.undo = undo;
  toastTimer = setTimeout(() => { root.innerHTML = ''; toast.undo = null; }, undo ? 5000 : 2800);
}

function render() {
  $('#classPick').innerHTML = state.classes.map(k => `<option value="${k.id}" ${k.id === state.currentId ? 'selected' : ''}>${esc(k.name)}</option>`).join('');
  document.querySelectorAll('nav.tabs button').forEach(b => {
    if (b.dataset.tab === ui.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  $('#main').innerHTML = ui.tab === 'rate' ? renderRate() : ui.tab === 'results' ? renderResults() : renderSettings();
}

  grpMinus: el => groupPoint(el.dataset.id, ui.mode, -1),
  gpt: el => groupPoint(el.dataset.id, el.dataset.c, +el.dataset.d),
  gDetail: el => openSheet(groupDetailSheet(el.dataset.id)),
  goGroups: () => { ui.tab = 'settings'; render(); document.getElementById('groupsCard')?.scrollIntoView({ block: 'start' }); },
  addGroup: () => openSheet(groupEditSheet(null)),
  editGroup: el => openSheet(groupEditSheet(el.dataset.id)),
  gIcon: el => { keepGName(); gDraft.icon = el.dataset.v; refreshSheet(); },
  gColor: el => { keepGName(); gDraft.color = el.dataset.v; refreshSheet(); },
  saveGroup: el => {
    keepGName(); const name = gDraft.name.trim(); if (!name) return toast('اكتبي اسم المجموعة');
    const c = cls(); let g = c.groups.find(x => x.id === el.dataset.id);
    if (!g) { g = { id: uid() }; c.groups.push(g); }
    Object.assign(g, { name, icon: gDraft.icon, color: gDraft.color });
    c.students.forEach(s => { if (gDraft.members.has(s.id)) s.groupId = g.id; else if (s.groupId === g.id) s.groupId = null; });
    save(); closeSheet(); render(); toast(`حُفظت مجموعة ${name} (${gDraft.members.size} طالب)`);
  },
  deleteGroup: el => {
    const c = cls(); const g = c.groups.find(x => x.id === el.dataset.id);
    if (!confirm(`حذف مجموعة «${g.name}»؟ يبقى طلابها ونقاطهم، لكن بدون مجموعة.`)) return;
    c.groups = c.groups.filter(x => x !== g); c.students.forEach(s => { if (s.groupId === g.id) s.groupId = null; });
    save(); closeSheet(); render();
  },
  quickGroups: () => {
    const c = cls(); if (!c.students.length) return toast('أضيفي طلاباً أولاً');
    const n = parseInt(prompt('كم مجموعة تريدين؟ سيُوزَّع الطلاب عليها بالتساوي، ويمكنك تعديل الأسماء والأعضاء بعدها.', '4'), 10);
    if (!n || n < 1) return; makeGroups(Math.min(n, 12)); save(); ui.view = 'groups'; render(); toast(`أُنشئت ${Math.min(n, 12)} مجموعات`);
  },
  shuffleGroups: () => { if (!confirm('إعادة توزيع كل الطلاب على المجموعات عشوائياً؟')) return; distribute(); save(); render(); toast('وُزّع الطلاب'); },
  stu: el => {
    const sid = el.dataset.id; ui.picked = null;
    const m = ui.mode === 'all' ? null : crit(ui.mode);
    if (!m) return openSheet(studentSheet(sid));
    if (m.type === 'points') return quickPoint(sid, 1);
    const cur = todayStatus(cls(), sid); const next = { null: 'p', p: 'a', a: 'l', l: null }[cur];
    setAttendance(sid, next); render();
  },
  quickMinus: el => quickPoint(el.dataset.id, -1),
  allPresent: () => {
    const c = cls(); let n = 0;
    c.students.forEach(s => { if (!todayStatus(c, s.id)) { setAttendance(s.id, 'p'); n++; } });
    render(); toast(n ? `سُجّل ${n} طالب حاضرين` : 'كل الطلاب مسجلون بالفعل');
  },
  openWheel: () => { wheel.rot = 0; wheel.winner = null; drawWheel(); },
  closeWheel: () => { if (wheel.spinning) return; $('#wheelRoot').innerHTML = ''; render(); },
  spin: () => spinWheel(),
  wheelSound: () => { wheel.sound = !wheel.sound; try { localStorage.setItem('multaqa-wheel-sound', wheel.sound ? '1' : '0'); } catch (e) {} drawWheel(); },
  winYes: () => {
    const s = wheel.winner; const w = wheelState(cls()); if (!w.picked.includes(s.id)) w.picked.push(s.id);
    const pc = wheelCriterion(); let e = null;
    if (pc) e = addEvent(s.id, pc.id, 1); else save();
    wheel.winner = null; wheel.rot = 0; drawWheel();
    toast(pc ? `+1 ${pc.name} · ${s.name}` : `شارك ${s.name}`, () => { if (e) undoEvent(e.id); const ww = wheelState(cls()); ww.picked = ww.picked.filter(x => x !== s.id); save(); drawWheel(); });
  },
  winNo: () => { wheel.winner = null; wheel.rot = 0; drawWheel(); },
  winOut: () => { const w = wheelState(cls()); w.picked.push(wheel.winner.id); save(); wheel.winner = null; wheel.rot = 0; drawWheel(); },
  unpick: el => { const w = wheelState(cls()); w.picked = w.picked.filter(x => x !== el.dataset.id); save(); wheel.rot = 0; drawWheel(); },
  wheelReset: () => { const w = wheelState(cls()); w.picked = []; save(); wheel.rot = 0; drawWheel(); },
  pt: el => {
    const e = addEvent(el.dataset.id, el.dataset.c, +el.dataset.d); refreshSheet(); render();
    toast(`${signed(e.d)} ${crit(e.c).name}`, () => undoEvent(e.id));
  },
  att: el => { const cur = todayStatus(cls(), el.dataset.id); setAttendance(el.dataset.id, cur === el.dataset.v ? null : el.dataset.v); refreshSheet(); render(); },
  close: () => closeSheet(),
  backdrop: (el, ev) => { if (ev.target === el) closeSheet(); },
  undo: () => { const u = toast.undo; $('#toastRoot').innerHTML = ''; toast.undo = null; if (u) u(); },

  period: el => { ui.period = el.dataset.id; ui.offset = 0; render(); },
  shift: el => { ui.offset = Math.min(0, ui.offset + +el.dataset.d); render(); },
  detail: el => openSheet(detailSheet(el.dataset.id)),
  delEvent: el => { const c = cls(); c.events = c.events.filter(e => e.id !== el.dataset.id); save(); refreshSheet(); render(); },
  print: () => print(),
  shareText: async () => {
    const t = resultsText();
    try { if (navigator.share) { await navigator.share({ text: t }); return; } } catch (e) { return; }
    try { await navigator.clipboard.writeText(t); toast('نُسخت النتائج، الصقيها في واتساب أو أي مكان'); } catch (e) { toast('تعذّر النسخ'); }

  addStudents: () => openSheet(addStudentsSheet),

  saveStudent: el => {

    save(); closeSheet(); render(); toast('حُذف الطالب');
  },

  toggleCrit: el => { const x = crit(el.dataset.id); x.on = !x.on; save(); render(); },
  addCrit: () => openSheet(critSheet(null)),
  editCrit: el => openSheet(critSheet(el.dataset.id)),
  critIcon: el => { keepCritName(); critDraft.icon = el.dataset.v; refreshSheet(); },
  critType: el => { keepCritName(); critDraft.type = el.dataset.v; refreshSheet(); },
  saveCrit: el => {
    keepCritName(); const name = critDraft.name.trim();
    if (!name) return toast('اكتبي اسم المعيار');
    const id = el.dataset.id;
    if (id) Object.assign(crit(id), { name, icon: critDraft.icon, type: critDraft.type });
    else state.criteria.push({ id: uid(), name, icon: critDraft.icon, type: critDraft.type, on: true });
    save(); closeSheet(); render(); toast('حُفظ المعيار');
  },
  deleteCrit: el => {
    const x = crit(el.dataset.id);
    if (!confirm(`حذف معيار «${x.name}»؟ ستُحذف تقييماته أيضاً. (لإخفائه فقط استخدمي زر التفعيل)`)) return;
    state.criteria = state.criteria.filter(c => c.id !== x.id);
    state.classes.forEach(k => { k.events = k.events.filter(e => e.c !== x.id); });
    save(); closeSheet(); render();
  },

  addClass: () => {
    const n = prompt('اسم الصف الجديد (مثال: ثالث / 2)'); if (!n || !n.trim()) return;
    const k = newClass(n.trim()); state.classes.push(k); state.currentId = k.id; save(); render(); toast('أُضيف الصف ' + k.name);
  },
  renameClass: el => {
    const k = state.classes.find(x => x.id === el.dataset.id); const n = prompt('الاسم الجديد للصف', k.name);
    if (n && n.trim()) { k.name = n.trim(); save(); render(); }
  },
  deleteClass: el => {
    const k = state.classes.find(x => x.id === el.dataset.id);
    if (!confirm(`حذف صف «${k.name}» بكل طلابه وتقييماته؟`)) return;
    state.classes = state.classes.filter(x => x !== k);
    if (state.currentId === k.id) state.currentId = state.classes[0].id;
    save(); render();
  },
  export: () => openSheet(exportSheet),
  download: () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([exportJSON()], { type: 'application/json' }));
    a.download = 'multaqa-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
  },
  copyExport: async () => { try { await navigator.clipboard.writeText(exportJSON()); toast('نُسخ النص'); } catch (e) { toast('تعذّر النسخ، استخدمي «حفظ كملف»'); } },
  import: () => openSheet(importSheet),
  chooseFile: () => $('#importFile').click(),
  doImport: () => { const t = $('#importText').value.trim(); if (t) importText(t); },
  resetAll: () => {
    if (!confirm('سيُحذف كل شيء: الصفوف والطلاب والتقييمات. هل أنتِ متأكدة؟')) return;
    if (!confirm('تأكيد أخير: لا يمكن التراجع عن هذا.')) return;
    state = fresh(); ui.period = state.period; save(); render(); toast('بدأتِ من جديد');
  },
};

// الحفاظ على النص المكتوب عند إعادة رسم النافذة
let pendingName = null;
function keepName() { const n = $('#stuName'); pendingName = n ? n.value : null; }
function restoreName() { const n = $('#stuName'); if (n && pendingName != null) n.value = pendingName; pendingName = null; }
function keepCritName() { const n = $('#critName'); if (n) critDraft.name = n.value; }

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = actions[el.dataset.act]; if (fn) fn(el, ev);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && sheetFn) return closeSheet();
  if (ev.key === 'Escape' && $('#wheelRoot').innerHTML && !wheel.spinning) return actions.closeWheel();
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('.stu, .grp, tr.click')) { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener('change', ev => {
  const ch = ev.target.dataset.change;
  if (ch === 'weekStart') { state.weekStart = +ev.target.value; save(); render(); }
  if (ch === 'stuGroup') editGroup = ev.target.value || null;
  if (ch === 'gm') { if (ev.target.checked) gDraft.members.add(ev.target.value); else gDraft.members.delete(ev.target.value);
    const gc = $('#gCount'); if (gc) gc.textContent = `(${gDraft.members.size} محدد)`; }
});
$('#classPick').addEventListener('change', ev => { state.currentId = ev.target.value; ui.picked = null; $('#wheelRoot').innerHTML = ''; save(); render(); });
$('#photoInput').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  try { editPhoto = await resizeImage(f); refreshSheet(); restoreName(); } catch (e) { toast('تعذّر فتح الصورة'); }
});
$('#importFile').addEventListener('change', ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  const r = new FileReader(); r.onload = () => importText(String(r.result)); r.readAsText(f);
});

render();
if (migratedNote) { save(); toast(migratedNote); }
</script>
</body>
</html>

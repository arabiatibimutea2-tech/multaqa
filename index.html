<style>
/* Landscape classroom board: gradient header strip, pastel cards on a doodle paper ground */
:root {
  color-scheme: light;
  --paper: #fbf9f6;
  --ink: #1f2a44;
  --ink-soft: #5b6680;
  --line: #e4e7ef;
  --sky: #5ab8f5;
  --sun: #ffcf4a;
  --mint: #6fd69a;
  --rose: #f58fb8;
  --danger: #f2787a;
  --font-display: "Baloo Bhaijaan 2", Tajawal, system-ui, sans-serif;
  --font-body: Tajawal, "Baloo Bhaijaan 2", system-ui, sans-serif;
}
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--font-body); min-height: 100%; }
.doodle-bg { position: fixed; inset: 0; z-index: 0; background-image: var(--bgimg); background-size: 520px; opacity: .55; pointer-events: none; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.font-display { font-family: var(--font-display); }
button { cursor: pointer; }
h1, h2, h3 { text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }
.topbar { background: linear-gradient(90deg, #f79ac6 0%, #8fe3c9 32%, #66c4f6 66%, #8b93f3 100%); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: #8fe3c9; }
.btn3d { box-shadow: 0 3px 0 rgba(31,42,68,.18); transition: transform .12s ease, box-shadow .12s ease; }
.btn3d:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(31,42,68,.18); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #3b82f6; outline-offset: 2px; }
.card-pop { animation: cardpop .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes cardpop { 0% { transform: scale(1) } 40% { transform: scale(1.06) } 100% { transform: scale(1) } }
.card-shake { animation: shake .4s ease; }
@keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-5px) } 75% { transform: translateX(5px) } }
.float-pop { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); animation: floatup 1.2s ease-out forwards; pointer-events: none; z-index: 5; }
@keyframes floatup { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.6) } 20% { opacity: 1; transform: translate(-50%, 0) scale(1.15) } 100% { opacity: 0; transform: translate(-50%, -60px) scale(1) } }
.twinkle { animation: twinkle 1s ease; }
@keyframes twinkle { 0%,100% { transform: scale(1) rotate(0) } 30% { transform: scale(1.5) rotate(-20deg) } 60% { transform: scale(.9) rotate(15deg) } }
.spark { position: absolute; pointer-events: none; animation: spark 1s ease-out forwards; }
@keyframes spark { 0% { opacity: 1; transform: translate(0,0) scale(.4) } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.1) } }
.fade-in { animation: fadein .25s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
.bob { animation: bob 3s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
